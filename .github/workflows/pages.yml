name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          ABEA82: ${{ secrets.ABEA82 }}
          BF4853: ${{ secrets.BF4853 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('ABEA82', '')
          bm = os.environ.get('BF4853', '')
          count = 0
          for p in pathlib.Path('.').rglob('*.html'):
              try:
                  s = p.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              s2 = s
              if gm:
                  s2 = s2.replace('<!-- 21f0ae9aa8cbcc3339c98ccd278721e16c800a -->', gm)
              if bm:
                  s2 = s2.replace('<!-- 73e8895d4637ab0a3d7b1e319d30a4884cd6ff25fda8c810 -->', bm)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  count += 1
          if count == 0 and (gm or bm):
              sys.exit(1)
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
